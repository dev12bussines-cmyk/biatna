<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المطورين - بيئتنا</title>
    
    <!-- خط Tajawal لتصميم عربي احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
    :root {
        --primary-green: #1b4332;
        --accent-green: #2d6a4f;
        --light-green: #52b788;
        --glow-green: #74c69d;
        --bg-gradient: linear-gradient(135deg, #081c15 0%, #1b4332 50%, #2d6a4f 100%);
        --glass-bg: rgba(255, 255, 255, 0.12);
        --glass-border: rgba(255, 255, 255, 0.2);
    }

    * {
        box-sizing: border-box;
        font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        background: var(--bg-gradient);
        color: #ffffff;
        overflow-x: hidden;
    }

    /* شريط الملاحة العلوي الموحد */
    .tabs-nav {
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: rgba(8, 28, 21, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--glass-border);
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tabs-container {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
    }

    .brand-logo {
        font-size: 20px;
        font-weight: 800;
        color: var(--light-green);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.3s ease;
    }

    .brand-logo:hover {
        transform: scale(1.05);
    }

    .tabs-list {
        display: flex;
        align-items: center;
        list-style: none;
        margin: 0;
        padding: 0;
        gap: 16px;
    }

    .tab-link {
        display: inline-block;
        padding: 16px 12px;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.75);
        font-size: 15px;
        font-weight: 500;
        position: relative;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .tab-link:hover {
        color: var(--light-green);
        transform: translateY(-2px);
    }

    .tab-link.active {
        color: #ffffff;
        font-weight: 700;
    }

    .tab-link::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0%;
        height: 3px;
        background: var(--light-green);
        border-radius: 3px 3px 0 0;
        box-shadow: 0 0 10px var(--light-green);
        transition: width 0.3s ease;
    }

    .tab-link.active::after,
    .tab-link:hover::after {
        width: 100%;
    }

    /* الحاوية الرئيسية للمحتوى */
    .main-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 110px;
        padding: 20px 15px;
        width: 100%;
        max-width: 650px;
    }

    /* بطاقة المحتوى الزجاجية */
    .content-card {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        text-align: center;
        width: 100%;
        animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .content-card:hover {
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 25px rgba(82, 183, 136, 0.15);
    }

    .page-title {
        color: #ffffff;
        font-size: 28px;
        font-weight: 800;
        margin: 0 0 20px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-bottom: 1px solid var(--glass-border);
        padding-bottom: 15px;
    }

    .developers-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 25px 0;
    }

    .developer-badge {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 14px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        color: var(--glow-green);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        opacity: 0;
        animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .developer-badge:nth-child(1) { animation-delay: 0.3s; }
    .developer-badge:nth-child(2) { animation-delay: 0.5s; }
    .developer-badge:nth-child(3) { animation-delay: 0.7s; }

    .developer-badge:hover {
        transform: translateY(-4px) scale(1.02);
        background: rgba(82, 183, 136, 0.2);
        border-color: var(--glow-green);
        box-shadow: 0 8px 20px rgba(82, 183, 136, 0.3);
        color: #ffffff;
    }

    .footer-note {
        color: #d8f3dc;
        font-size: 15px;
        line-height: 1.6;
        margin-top: 20px;
        opacity: 0.9;
    }

    /* Animations Definitions */
    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes scaleUp {
        from {
            opacity: 0;
            transform: scale(0.92) translateY(20px);
        }
        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(30px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @media (max-width: 480px) {
        .tabs-container { padding: 0 10px; }
        .tab-link { font-size: 13px; padding: 14px 8px; }
        .page-title { font-size: 22px; }
        .content-card { padding: 20px; }
        .developer-badge { font-size: 16px; }
    }
    </style>
</head>
<body>

    <!-- شريط الـ Tabs في الأعلى -->
    <nav class="tabs-nav">
        <div class="tabs-container">
            <div class="brand-logo">🌱 بيئتنا</div>
            <ul class="tabs-list">
                <li class="tab-item"><a href="what_is_this_app.html" class="tab-link">عن الموقع</a></li>
                <li class="tab-item"><a href="index.html" class="tab-link">الرئيسية</a></li>
                <li class="tab-item"><a href="the_developers.html" class="tab-link active">المطورين</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="content-card">
            <h1 class="page-title">👨‍💻 من صنع الموقع؟</h1>
            
            <p style="color: #e2f1e7; font-size: 16px; margin-bottom: 15px;">شارك في تأسيس وتطوير هذا المشروع نخبة من المطورين المتميزين:</p>

            <div class="developers-grid">
                <div class="developer-badge">⭐ مكاريوس ميخائيل</div>
                <div class="developer-badge">⭐ جيوفاني مايكل</div>
                <div class="developer-badge">⭐ فيلوباتير هاني</div>
            </div>

            <h4 class="footer-note">
                نتمنى أن ينال الموقع إعجابكم وأن يقدم الأداء المطلوب لخدمة وتوعية مجتمعنا نحو بيئة أفضل وأنظف.
            </h4>
        </div>
    </div>

</body>
</html>
